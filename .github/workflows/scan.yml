name: Scan

# Heavier / network-dependent checks, kept out of CI so `validate` stays fast
# and hermetic. Shell steps only (pinned binaries) so `act` runs them locally.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  LYCHEE_VERSION: lychee-v0.24.2

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks

      - name: Scan git history for secrets
        run: /tmp/gitleaks detect --source . --verbose

  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install lychee
        run: |
          curl -sL -o /tmp/lychee.tar.gz \
            "https://github.com/lycheeverse/lychee/releases/download/${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          tar xzf /tmp/lychee.tar.gz -C /tmp lychee-x86_64-unknown-linux-gnu/lychee

      - name: Check links
        run: /tmp/lychee-x86_64-unknown-linux-gnu/lychee --no-progress --root-dir . "**/*.html"
